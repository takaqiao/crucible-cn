name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read tag version
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify module.json version matches tag
        run: |
          MJ_VERSION=$(jq -r .version module.json)
          if [ "$MJ_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::module.json version ($MJ_VERSION) != tag (${{ steps.version.outputs.version }})"
            exit 1
          fi
          echo "module.json version matches tag: $MJ_VERSION"

      - name: Verify download URL points to this tag
        run: |
          DOWNLOAD=$(jq -r .download module.json)
          EXPECTED=".*/releases/download/${{ steps.version.outputs.tag }}/module.zip"
          if ! echo "$DOWNLOAD" | grep -qE "$EXPECTED"; then
            echo "::error::module.json download URL ($DOWNLOAD) does not match expected pattern $EXPECTED"
            exit 1
          fi
          echo "download URL ok: $DOWNLOAD"

      # changelog 没有这道闸的时候，它在 0.9.0 上原地不动地漂了两个版本：
      # version 与 download 每次发版都被逐字校验，changelog 谁都没看，于是静默过期。
      - name: Verify changelog URL points to this tag
        run: |
          CHANGELOG=$(jq -r .changelog module.json)
          EXPECTED="https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          if [ "$CHANGELOG" != "$EXPECTED" ]; then
            echo "::error::module.json changelog ($CHANGELOG) != expected ($EXPECTED)"
            exit 1
          fi
          echo "changelog URL ok: $CHANGELOG"

      - name: Build module.zip
        run: |
          # zip 对已存在的同名档案是**追加更新**、不是重建。仓库里若留着上一版的
          # module.zip，旧内容会原样活到新包里（ember 侧 1.1.0 就这么发出去过）。先删干净。
          #
          # 排除清单里两项是**纯死重量**，运行时永远不会被读：
          #   lang/en.json —— module.json 的 languages 只声明 cn，这份只是
          #                   lang_gap.py / flatten_lang.py 的英文基准（约 110 KB）。
          #   scripts/*    —— 仓库侧维护脚本（.py/.mjs，约 63 KB）；esmodules 只有
          #                   babele-register.js，Foundry 不会加载 scripts/ 下的任何东西。
          # 两者都**保留在仓库里**（QA 依赖），只是不进发布包。
          rm -f module.zip
          zip -r module.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "release/*" \
            -x "compendium/en/*" \
            -x "lang/lang_keep_english.json" \
            -x "lang/en.json" \
            -x "scripts/*" \
            -x "untranslated-*-report.json" \
            -x "*.zip" \
            -x "*.bak" \
            -x ".DS_Store" \
            -x "Thumbs.db"
          ls -la module.zip
          # 上面那串 -x 是**声明**，不是保证：zip 的追加语义、通配符写错一个字符、
          # 或者仓库里新冒出一个 .py，都会让排除清单静默失效，而 `ls -la` 只看得见
          # 体积。ember 侧已有这道断言，crucible 侧一直缺 —— 补齐，正则逐项对应
          # 上面的排除清单。
          echo "--- 确认英文基准/维护脚本没被打进去（应无输出）---"
          unzip -l module.zip | grep -E "compendium/en/|lang/en\.json|lang_keep_english\.json|scripts/|release/|\.py$|\.zip$" && exit 1 || true
          unzip -l module.zip | tail -10

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body_path: .github/release-body-template.md
          fail_on_unmatched_files: true
          files: |
            module.json
            module.zip

      - name: Publish to Foundry packages registry
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${FOUNDRY_RELEASE_TOKEN}" ]; then
            echo "FOUNDRY_RELEASE_TOKEN secret not set; skipping Foundry packages publish."
            exit 0
          fi
          MIN=$(jq -r '.compatibility.minimum // ""' module.json)
          VER=$(jq -r '.compatibility.verified // ""' module.json)
          MAX=$(jq -r '.compatibility.maximum // ""' module.json)
          ID=$(jq -r '.id' module.json)
          MANIFEST_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/module.json"
          NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          BODY=$(jq -n \
            --arg id "$ID" \
            --arg version "$VERSION" \
            --arg manifest "$MANIFEST_URL" \
            --arg notes "$NOTES_URL" \
            --arg minimum "$MIN" \
            --arg verified "$VER" \
            --arg maximum "$MAX" \
            '{
              id: $id,
              release: {
                version: $version,
                manifest: $manifest,
                notes: $notes,
                compatibility: ({
                  minimum: $minimum,
                  verified: $verified
                } + (if $maximum != "" then {maximum: $maximum} else {} end))
              }
            }')

          echo "Posting to Foundry packages API..."
          RESP=$(curl -sS --fail-with-body \
            -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Content-Type: application/json" \
            -H "Authorization: ${FOUNDRY_RELEASE_TOKEN}" \
            -d "$BODY")
          echo "Foundry API response: $RESP"
